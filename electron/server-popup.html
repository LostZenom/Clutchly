<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Clutchly — Server</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      body {
        background: transparent;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        color: #eef0f3;
      }

      /* Same signature shimmer card as the update popup / home page. */
      .toast {
        position: relative;
        isolation: isolate;
        border-radius: 8px;
        overflow: hidden;
        background: #0b0c0e;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        width: 100%;
        height: 100%;
      }
      .toast::before {
        content: "";
        position: absolute;
        inset: -200%;
        z-index: -2;
        background: conic-gradient(
          from 0deg at 50% 50%,
          transparent 0deg,
          transparent 120deg,
          #38bdf8 150deg,
          #a855f7 195deg,
          transparent 230deg,
          transparent 360deg
        );
        animation: shimmer-rotate 7s linear infinite;
      }
      .toast::after {
        content: "";
        position: absolute;
        inset: 1px;
        z-index: -1;
        border-radius: 7px;
        background: #0b0c0e;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      @keyframes shimmer-rotate {
        to {
          transform: rotate(360deg);
        }
      }

      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* bottom padding clears the pinned debug console */
        padding: 16px 24px 96px;
      }

      .close {
        position: absolute;
        top: 9px;
        right: 9px;
        background: transparent;
        border: none;
        padding: 0;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8b949f;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        border-radius: 6px;
        transition: color 0.14s ease, background 0.14s ease;
      }
      .close:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.06);
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
      }

      .icon-wrap {
        position: relative;
        margin-bottom: 11px;
      }
      .icon-badge {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #7dd3fc;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.28);
      }
      .icon-badge svg {
        width: 24px;
        height: 24px;
      }

      /* Status badge: green check / red X / spinner */
      .status-badge {
        position: absolute;
        right: -7px;
        bottom: -7px;
        width: 21px;
        height: 21px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #0b0c0e;
        background: #0f1720;
      }
      .status-badge svg {
        width: 12px;
        height: 12px;
      }
      .status-badge.ok {
        background: #10b981;
        color: #04110c;
      }
      .status-badge.err {
        background: #ef4444;
        color: #1c0505;
      }
      .status-badge .spinner {
        width: 11px;
        height: 11px;
        border-radius: 99px;
        border: 2px solid rgba(125, 211, 252, 0.25);
        border-top-color: #7dd3fc;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #f2f4f6;
      }
      .sub {
        margin-top: 4px;
        font-size: 11px;
        color: #9aa3af;
        line-height: 1.45;
        max-width: 280px;
      }

      .url {
        margin-top: 9px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 600;
        color: #7dd3fc;
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.22);
        border-radius: 7px;
        padding: 5px 11px;
        text-decoration: none;
        font-variant-numeric: tabular-nums;
        transition: all 0.15s ease;
        cursor: pointer;
      }
      .url:hover {
        border-color: rgba(56, 189, 248, 0.55);
        background: rgba(56, 189, 248, 0.14);
        color: #aef0ff;
      }
      .url .go {
        font-size: 10px;
        opacity: 0.85;
      }

      .errbox {
        margin-top: 9px;
        max-width: 290px;
        font-size: 10.5px;
        color: #f0a2a2;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 7px;
        padding: 6px 10px;
        line-height: 1.45;
      }

      button.closebtn {
        margin-top: 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #0f1115;
        color: #d3d9e0;
        font-size: 11.5px;
        font-weight: 500;
        padding: 7px 18px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      button.closebtn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: #fff;
      }

      /* "Try another port" — quick restart without opening Settings */
      .portrow {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .portrow .plabel {
        font-size: 9.5px;
        color: #98a2b0;
        white-space: nowrap;
      }
      .portrow input {
        width: 84px;
        background: #0d0f13;
        border: 1px solid rgba(125, 211, 252, 0.3);
        border-radius: 7px;
        color: #eef0f3;
        font-size: 12px;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-variant-numeric: tabular-nums;
        padding: 5px 8px;
        outline: none;
        text-align: center;
      }
      .portrow input:focus {
        border-color: rgba(56, 189, 248, 0.8);
      }
      .portrow input::-webkit-outer-spin-button,
      .portrow input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .portrow button {
        border-radius: 7px;
        border: 1px solid rgba(56, 189, 248, 0.35);
        background: rgba(56, 189, 248, 0.12);
        color: #aef0ff;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 14px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .portrow button:hover:not(:disabled) {
        background: rgba(56, 189, 248, 0.22);
        border-color: rgba(56, 189, 248, 0.7);
      }
      .portrow button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* Bottom "what it's doing now" log console */
      .debug {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        height: 74px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.055);
        padding: 6px 9px 6px 8px;
        overflow-y: auto;
        text-align: left;
      }
      .debug::-webkit-scrollbar {
        width: 0;
      }
      .debug .lbl {
        display: block;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.28);
        margin-bottom: 3px;
      }
      .debug .ln {
        font: 9px/1.5 ui-monospace, "Cascadia Mono", "Consolas", monospace;
        color: #8f99a6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .debug .ln .t {
        color: rgba(255, 255, 255, 0.22);
      }
      .debug .ln.audio,
      .debug .ln.audio .t {
        color: rgba(125, 211, 252, 0.55);
      }
      .debug .ln.warn,
      .debug .ln.warn .t {
        color: rgba(250, 204, 21, 0.6);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="toast">
      <div class="content">
        <button class="close hidden" id="close" aria-label="Close">✕</button>

        <div class="stage">
          <div class="icon-wrap">
            <div class="icon-badge">
              <svg viewBox="0 0 24 24" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M2 7C2 5.11438 2 4.17157 2.58579 3.58579C3.17157 3 4.11438 3 6 3H18C19.8856 3 20.8284 3 21.4142 3.58579C22 4.17157 22 5.11438 22 7C22 8.88562 22 9.82843 21.4142 10.4142C20.8284 11 19.8856 11 18 11H6C4.11438 11 3.17157 11 2.58579 10.4142C2 9.82843 2 8.88562 2 7ZM6 6.25C5.58579 6.25 5.25 6.58579 5.25 7C5.25 7.41421 5.58579 7.75 6 7.75H8C8.41421 7.75 8.75 7.41421 8.75 7C8.75 6.58579 8.41421 6.25 8 6.25H6ZM10.25 7C10.25 6.58579 10.5858 6.25 11 6.25H18C18.4142 6.25 18.75 6.58579 18.75 7C18.75 7.41421 18.4142 7.75 18 7.75H11C10.5858 7.75 10.25 7.41421 10.25 7Z" fill="currentColor"></path>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M2 17C2 15.1144 2 14.1716 2.58579 13.5858C3.17157 13 4.11438 13 6 13H18C19.8856 13 20.8284 13 21.4142 13.5858C22 14.1716 22 15.1144 22 17C22 18.8856 22 19.8284 21.4142 20.4142C20.8284 21 19.8856 21 18 21H6C4.11438 21 3.17157 21 2.58579 20.4142C2 19.8284 2 18.8856 2 17ZM6 16.25C5.58579 16.25 5.25 16.5858 5.25 17C5.25 17.4142 5.58579 17.75 6 17.75H8C8.41421 17.75 8.75 17.4142 8.75 17C8.75 16.5858 8.41421 16.25 8 16.25H6ZM10.25 17C10.25 16.5858 10.5858 16.25 11 16.25H18C18.4142 16.25 18.75 16.5858 18.75 17C18.75 17.4142 18.4142 17.75 18 17.75H11C10.5858 17.75 10.25 17.4142 10.25 17Z" fill="currentColor"></path>
              </svg>
            </div>
            <div class="status-badge" id="statusbadge">
              <svg id="svgcheck" class="hidden" viewBox="0 0 24 24" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C22 4.92893 22 7.28595 22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22ZM16.0303 8.96967C16.3232 9.26256 16.3232 9.73744 16.0303 10.0303L11.0303 15.0303C10.7374 15.3232 10.2626 15.3232 9.96967 15.0303L7.96967 13.0303C7.67678 12.7374 7.67678 12.2626 7.96967 11.9697C8.26256 11.6768 8.73744 11.6768 9.03033 11.9697L10.5 13.4393L14.9697 8.96967C15.2626 8.67678 15.7374 8.67678 16.0303 8.96967Z" fill="currentColor"></path>
              </svg>
              <svg id="svgx" class="hidden" viewBox="0 0 24 24" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C22 4.92893 22 7.28595 22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22ZM8.96965 8.96967C9.26254 8.67678 9.73742 8.67678 10.0303 8.96967L12 10.9394L13.9696 8.96969C14.2625 8.6768 14.7374 8.6768 15.0303 8.96969C15.3232 9.26258 15.3232 9.73746 15.0303 10.0303L13.0606 12L15.0303 13.9697C15.3232 14.2625 15.3232 14.7374 15.0303 15.0303C14.7374 15.3232 14.2625 15.3232 13.9696 15.0303L12 13.0607L10.0303 15.0303C9.73744 15.3232 9.26256 15.3232 8.96967 15.0303C8.67678 14.7374 8.67678 14.2626 8.96967 13.9697L10.9393 12L8.96965 10.0303C8.67676 9.73744 8.67676 9.26256 8.96965 8.96967Z" fill="currentColor"></path>
              </svg>
              <div class="spinner" id="spinner"></div>
            </div>
          </div>

          <div class="title" id="title">Starting Clutchly…</div>
          <div class="sub" id="sub">Booting the local server…</div>
          <a class="url hidden" id="url" href="#"><span id="urltext"></span><span class="go">↗</span></a>
          <div class="errbox hidden" id="errbox"></div>
          <div class="portrow hidden" id="portrow">
            <span class="plabel">Restart on port</span>
            <input id="portinput" type="number" min="1024" max="65535" inputmode="numeric" />
            <button id="restartbtn" type="button">Start</button>
          </div>
          <button class="closebtn hidden" id="closebtn">Close</button>
        </div>

        <div class="debug" id="debug">
          <span class="lbl">Server activity</span>
          <div id="loglines"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const badge = $("statusbadge");
        const check = $("svgcheck");
        const xmark = $("svgx");
        const spinner = $("spinner");
        const title = $("title");
        const sub = $("sub");
        const url = $("url");
        const urltext = $("urltext");
        const errbox = $("errbox");
        const close = $("close");
        const closebtn = $("closebtn");
        const portrow = $("portrow");
        const portinput = $("portinput");
        const restartbtn = $("restartbtn");
        let lastErrorPort = 3100;

        function setState(s) {
          const data = s || {};
          check.classList.add("hidden");
          xmark.classList.add("hidden");
          spinner.classList.add("hidden");
          badge.classList.remove("ok", "err");
          url.classList.add("hidden");
          errbox.classList.add("hidden");
          close.classList.add("hidden");
          closebtn.classList.add("hidden");
          portrow.classList.add("hidden");
          restartbtn.disabled = false;
          restartbtn.textContent = "Start";

          if (data.status === "ok") {
            check.classList.remove("hidden");
            badge.classList.add("ok");
            title.textContent = "Server started";
            sub.textContent = "Clutchly is live on this port";
            urltext.textContent = data.url || "";
            if (data.url) url.classList.remove("hidden");
            close.classList.remove("hidden");
          } else if (data.status === "error") {
            xmark.classList.remove("hidden");
            badge.classList.add("err");
            title.textContent = "Couldn't start the server";
            sub.textContent = data.port ? `Port ${data.port} refused to start the site` : "The local server failed to start";
            errbox.textContent = data.message || "Unknown error";
            errbox.classList.remove("hidden");
            close.classList.remove("hidden");
            closebtn.classList.remove("hidden");

            // Prefill a likely-free port and offer an instant restart.
            lastErrorPort = data.port || lastErrorPort;
            portinput.value = String(Math.min(65535, lastErrorPort + 5));
            portrow.classList.remove("hidden");
            restartbtn.disabled = false;
            restartbtn.textContent = "Start";
          } else {
            spinner.classList.remove("hidden");
            title.textContent = "Starting Clutchly…";
            sub.textContent = data.port ? `Booting the local server on port ${data.port}…` : "Booting the local server…";
          }
        }

        function openUrl() {
          const target = urltext.textContent;
          if (!target) return;
          if (window.serverPopup && window.serverPopup.openUrl) {
            window.serverPopup.openUrl(target);
          } else {
            location.href = target; // preview fallback
          }
        }

        url.addEventListener("click", openUrl);
        close.addEventListener("click", () =>
          window.serverPopup ? window.serverPopup.close() : null
        );
        closebtn.addEventListener("click", () =>
          window.serverPopup ? window.serverPopup.close() : null
        );

        restartbtn.addEventListener("click", () => {
          const parsed = parseInt(portinput.value, 10);
          const target = Number.isInteger(parsed) && parsed >= 1 && parsed <= 65535 ? parsed : lastErrorPort + 1;
          restartbtn.disabled = true;
          restartbtn.textContent = "Restarting…";
          if (window.serverPopup && window.serverPopup.tryPort) {
            window.serverPopup.tryPort(target);
          } else {
            // preview fallback: simulate the request
            setState({ status: "starting", port: target });
            addLog("requested restart on port " + target);
          }
        });

        // ---- bottom debug console --------------------------------------
        const loglines = $("loglines");
        const lastLine = {};
        const audioRe = /ready|listening|compiled|ready in|started server/i;
        const warnRe = /warn|error|fail|refused|shutdown|closed leftover/i;

        function stamp() {
          const d = new Date();
          return String(d.getHours()).padStart(2, "0") + ":" +
            String(d.getMinutes()).padStart(2, "0") + ":" +
            String(d.getSeconds()).padStart(2, "0");
        }

        function addLog(raw) {
          const line = String(raw || "").replace(/^\[site\]\s*/i, "");
          if (!line) return;
          // Collapse rapid repeats of the same line (e.g. boot polling).
          if (line === lastLine.text) {
            lastLine.count++;
            lastLine.el.textContent = `${line} ×${lastLine.count}`;
            return;
          }
          lastLine.text = line;
          lastLine.count = 1;
          const el = document.createElement("div");
          el.className = "ln";
          const t = document.createElement("span");
          t.className = "t";
          t.textContent = `${stamp()}  `;
          el.appendChild(t);
          el.appendChild(document.createTextNode(line));
          if (audioRe.test(line)) el.classList.add("audio");
          else if (warnRe.test(line)) el.classList.add("warn");
          lastLine.el = el;
          loglines.appendChild(el);
          while (loglines.childElementCount > 40) loglines.firstChild.remove();
          loglines.scrollTop = loglines.scrollHeight;
        }

        if (window.serverPopup) {
          window.serverPopup.onLog((d) => addLog(d && d.line));
          window.serverPopup.getLogs().then((lines) => {
            (lines || []).forEach(addLog);
          });
          window.serverPopup.onState(setState);
        } else {
          // Preview mode: demo the states via the URL hash (#ok / #error).
          const h = location.hash;
          addLog("checking port 3100…");
          addLog("no leftover localhost server on 127.0.0.1:3100");
          if (h === "#ok") {
            setState({ status: "ok", url: "http://127.0.0.1:3100/" });
            addLog("starting site (standalone) on 127.0.0.1:3100…");
            addLog("site ready at http://127.0.0.1:3100");
          } else if (h === "#error") {
            setState({ status: "error", port: 3100, message: "The website could not start on port 3100. It may already be in use by another app — try a different port in Settings." });
            addLog("starting site (standalone) on 127.0.0.1:3100…");
            addLog("port 3100 refused to bind — it may already be in use");
          } else {
            setState({ status: "starting", port: 3100 });
            addLog("starting site (standalone) on 127.0.0.1:3100…");
          }
        }
      })();
    </script>
  </body>
</html>
