<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Clutchly — Update</title>
    <style>
      @property --angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      body {
        background: transparent;
        height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 16px;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Glass card — more transparent, softer. */
      .card {
        position: relative;
        width: 380px;
        border-radius: 8px;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015) 45%, rgba(255, 255, 255, 0.03));
        backdrop-filter: blur(22px) saturate(1.35);
        -webkit-backdrop-filter: blur(22px) saturate(1.35);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.5),
          0 0 40px rgba(76, 194, 255, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }

      /* Full shimmer ring — a bright comet orbits the edge. */
      .card::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 10px;
        padding: 2px;
        background: conic-gradient(
          from var(--angle),
          rgba(76, 194, 255, 0) 0deg,
          rgba(76, 194, 255, 0.06) 40deg,
          rgba(76, 194, 255, 0.35) 90deg,
          #8fe0ff 120deg,
          #4cc2ff 150deg,
          rgba(47, 155, 216, 0.7) 180deg,
          rgba(76, 194, 255, 0.05) 220deg,
          rgba(255, 255, 255, 0.12) 300deg,
          rgba(76, 194, 255, 0) 360deg
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: orbit 2.6s linear infinite;
        filter: drop-shadow(0 0 5px rgba(76, 194, 255, 0.55));
        pointer-events: none;
        z-index: 1;
      }
      @keyframes orbit {
        to {
          --angle: 360deg;
        }
      }

      /* Soft breathing glow behind the ring. */
      .card::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 13px;
        background: radial-gradient(60% 60% at 50% 50%, rgba(76, 194, 255, 0.14), transparent 70%);
        opacity: 0.5;
        animation: breathe 3.4s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.65;
        }
      }

      .inner {
        position: relative;
        z-index: 2;
        padding: 17px 19px 15px;
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 11px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8fe0ff, #2f9bd8);
        box-shadow: 0 0 12px rgba(76, 194, 255, 0.9);
        animation: pulse 2.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.8);
          opacity: 0.55;
        }
      }
      .brand b {
        font-size: 13px;
        letter-spacing: 0.03em;
        color: #f7f9fb;
      }
      .close {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: #7f8892;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        transition: all 0.16s ease;
      }
      .close:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.32);
        background: rgba(255, 255, 255, 0.09);
      }

      .title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #f5f7f9;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pill {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #8fe0ff;
        background: rgba(76, 194, 255, 0.12);
        border: 1px solid rgba(76, 194, 255, 0.32);
        border-radius: 99px;
        padding: 2.5px 9px;
      }
      .status {
        margin: 4px 0 14px;
        font-size: 12px;
        color: #a7b0ba;
        min-height: 17px;
        line-height: 1.5;
      }

      .bar {
        height: 5px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: linear-gradient(90deg, #2f9bd8, #4cc2ff, #8fe0ff);
        box-shadow: 0 0 14px rgba(76, 194, 255, 0.8);
        transition: width 0.25s ease;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 7px;
        font-size: 10.5px;
        color: #6e7782;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 15px;
      }
      button.action {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: #d9dde2;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
        padding: 8px 16px;
        cursor: pointer;
        transition: all 0.16s ease;
      }
      button.action:hover {
        border-color: rgba(255, 255, 255, 0.32);
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
      }
      button.primary {
        border-color: rgba(76, 194, 255, 0.5);
        background: linear-gradient(135deg, rgba(76, 194, 255, 0.92), rgba(47, 155, 216, 0.92));
        color: #051420;
        font-weight: 600;
      }
      button.primary::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%);
        background-size: 220% 100%;
        animation: sweep 2.3s linear infinite;
        pointer-events: none;
      }
      @keyframes sweep {
        0% {
          background-position: 130% 0;
        }
        100% {
          background-position: -130% 0;
        }
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="inner">
        <div class="head">
          <div class="brand">
            <span class="dot"></span>
            <b>Clutchly</b>
          </div>
          <button class="close" id="close" aria-label="Close">✕</button>
        </div>

        <div class="title">
          <span id="title">Update</span>
          <span class="pill" id="pill">checking</span>
        </div>
        <div class="status" id="status">Checking for updates…</div>

        <div class="bar"><div class="fill" id="fill"></div></div>

        <div class="meta">
          <span id="left">Preparing…</span>
          <span id="right"></span>
        </div>

        <div class="actions">
          <button class="action hidden" id="cancel">Later</button>
          <button class="action primary hidden" id="install">Restart now</button>
          <button class="action hidden" id="retry">Check again</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const fill = $("fill");
        const status = $("status");
        const title = $("title");
        const left = $("left");
        const right = $("right");
        const installBtn = $("install");
        const cancelBtn = $("cancel");
        const retryBtn = $("retry");
        const pill = $("pill");

        function hideAllButtons() {
          installBtn.classList.add("hidden");
          cancelBtn.classList.add("hidden");
          retryBtn.classList.add("hidden");
        }

        function render(s) {
          if (s.status === "checking") {
            hideAllButtons();
            title.textContent = "Checking for updates";
            pill.textContent = "checking";
            status.textContent = "Clutchly looks for the latest build on GitHub…";
            left.textContent = "Please wait";
            right.textContent = "";
            fill.style.width = "0%";
          } else if (s.status === "available") {
            hideAllButtons();
            cancelBtn.classList.remove("hidden");
            title.textContent = "Update available";
            pill.textContent = "v" + (s.version || "new");
            status.textContent = "Downloading in the background — you'll see it right here.";
            left.textContent = "Starting download…";
            right.textContent = "";
          } else if (s.status === "downloading") {
            hideAllButtons();
            cancelBtn.classList.remove("hidden");
            const pct = s.percent || 0;
            fill.style.width = pct + "%";
            title.textContent = "Updating Clutchly";
            pill.textContent = pct + "%";
            status.textContent = "Downloading the update — keep playing, it installs when ready.";
            left.textContent = pct + "%";
            if (s.total) {
              const mb = (b) => (b / 1048576).toFixed(1) + " MB";
              right.textContent = mb(s.transferred || 0) + " / " + mb(s.total);
            } else {
              right.textContent = "";
            }
          } else if (s.status === "downloaded") {
            hideAllButtons();
            installBtn.classList.remove("hidden");
            title.textContent = "Ready to update";
            pill.textContent = "ready";
            status.textContent = "The new version is downloaded and ready to install.";
            left.textContent = "100%";
            right.textContent = "Tap Restart to finish";
            fill.style.width = "100%";
          } else if (s.status === "none") {
            hideAllButtons();
            title.textContent = "You're up to date";
            pill.textContent = "latest";
            status.textContent = "Clutchly is running the newest version.";
            left.textContent = "All good ✓";
            right.textContent = "";
          } else if (s.status === "error") {
            hideAllButtons();
            retryBtn.classList.remove("hidden");
            title.textContent = "Update check failed";
            pill.textContent = "offline";
            status.textContent = "Couldn't reach the update server.";
            left.textContent = s.message || "Something went wrong";
            right.textContent = "";
          }
        }

        if (window.updater) {
          window.updater.onState(render);
          $("close").addEventListener("click", () => window.updater.close());
          $("cancel").addEventListener("click", () => window.updater.close());
          $("install").addEventListener("click", () => window.updater.install());
        }
      })();
    </script>
  </body>
</html>
