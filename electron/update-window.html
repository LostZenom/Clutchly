<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Clutchly — Update</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      body {
        background: transparent;
        height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 16px;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Rotating comet ring — no masks, guaranteed to render. */
      .border {
        position: relative;
        width: 384px;
        border-radius: 8px;
        padding: 1.5px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.5),
          0 0 34px rgba(76, 194, 255, 0.14);
      }
      .border::before {
        content: "";
        position: absolute;
        inset: -160%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(76, 194, 255, 0.04) 35deg,
          #9fe6ff 95deg,
          #4cc2ff 130deg,
          rgba(76, 194, 255, 0.05) 195deg,
          rgba(255, 255, 255, 0.14) 300deg,
          transparent 360deg
        );
        animation: orbit 2.6s linear infinite;
        pointer-events: none;
      }
      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }

      .body {
        position: relative;
        border-radius: 6.5px;
        background: linear-gradient(165deg, rgba(24, 28, 34, 0.82), rgba(11, 13, 17, 0.8));
        backdrop-filter: blur(24px) saturate(1.3);
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        padding: 16px 18px 13px;
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 11px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .logo {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        object-fit: contain;
      }
      .brand b {
        font-size: 13.5px;
        letter-spacing: 0.03em;
        color: #f7f9fb;
      }
      .ver-tag {
        margin-left: 2px;
        font-size: 10px;
        font-weight: 500;
        color: #7f8892;
        letter-spacing: 0.04em;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 6px;
        padding: 2px 7px;
        font-variant-numeric: tabular-nums;
      }
      .close {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: #dfe4ea;
        width: 25px;
        height: 25px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        transition: all 0.16s ease;
      }
      .close:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.1);
      }

      .title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #f5f7f9;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pill {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #8fe0ff;
        background: rgba(76, 194, 255, 0.12);
        border: 1px solid rgba(76, 194, 255, 0.32);
        border-radius: 99px;
        padding: 2.5px 9px;
      }
      .status {
        margin: 4px 0 13px;
        font-size: 12px;
        color: #a7b0ba;
        min-height: 17px;
        line-height: 1.5;
      }

      .bar {
        height: 5px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: linear-gradient(90deg, #2f9bd8, #4cc2ff, #8fe0ff);
        box-shadow: 0 0 14px rgba(76, 194, 255, 0.8);
        transition: width 0.25s ease;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 7px;
        font-size: 10.5px;
        color: #6e7782;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }
      button.action {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: #d9dde2;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
        padding: 8px 16px;
        cursor: pointer;
        transition: all 0.16s ease;
      }
      button.action:hover {
        border-color: rgba(255, 255, 255, 0.32);
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
      }
      button.primary {
        border-color: rgba(76, 194, 255, 0.5);
        background: linear-gradient(135deg, rgba(76, 194, 255, 0.92), rgba(47, 155, 216, 0.92));
        color: #051420;
        font-weight: 600;
      }
      button.primary::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%);
        background-size: 220% 100%;
        animation: sweep 2.3s linear infinite;
        pointer-events: none;
      }
      @keyframes sweep {
        0% {
          background-position: 130% 0;
        }
        100% {
          background-position: -130% 0;
        }
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .hidden {
        display: none !important;
      }

      /* Version picker */
      .picker {
        margin-top: 13px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        padding-top: 10px;
      }
      .picker-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: transparent;
        border: none;
        color: #8a93a0;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        padding: 4px 2px;
        cursor: pointer;
        transition: color 0.15s ease;
      }
      .picker-toggle:hover {
        color: #c6ccd4;
      }
      .picker-toggle .chev {
        font-size: 10px;
        transition: transform 0.2s ease;
        color: #5d6672;
      }
      .picker-toggle.open .chev {
        transform: rotate(90deg);
      }
      .picker-list {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.25s ease;
      }
      .picker-list.open {
        max-height: 168px;
        overflow-y: auto;
      }
      .picker-list::-webkit-scrollbar {
        width: 5px;
      }
      .picker-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 99px;
      }
      .ver-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 8px;
        border-radius: 7px;
        margin-top: 3px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .ver-row .v {
        font-size: 11.5px;
        font-weight: 600;
        color: #e6eaef;
        font-variant-numeric: tabular-nums;
      }
      .ver-row .m {
        font-size: 10px;
        color: #6e7782;
        margin-top: 1px;
      }
      button.rollback {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: #aab3be;
        border-radius: 6px;
        font-size: 10.5px;
        font-weight: 500;
        padding: 4px 10px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      button.rollback:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
      }
      .picker-note {
        font-size: 10px;
        color: #5d6672;
        margin-top: 7px;
        line-height: 1.45;
      }
      .picker-loading {
        font-size: 10.5px;
        color: #7f8892;
        padding: 6px 2px;
      }
    </style>
  </head>
  <body>
    <div class="border">
      <div class="body">
        <div class="head">
          <div class="brand">
            <img class="logo" src="./clutchly-logo.png" alt="" />
            <b>Clutchly</b>
            <span class="ver-tag" id="curver">v–</span>
          </div>
          <button class="close" id="close" aria-label="Close">✕</button>
        </div>

        <div class="title">
          <span id="title">Update</span>
          <span class="pill" id="pill">checking</span>
        </div>
        <div class="status" id="status">Checking for updates…</div>

        <div class="bar"><div class="fill" id="fill"></div></div>

        <div class="meta">
          <span id="left">Preparing…</span>
          <span id="right"></span>
        </div>

        <div class="actions">
          <button class="action hidden" id="cancel">Later</button>
          <button class="action primary hidden" id="install">Restart now</button>
          <button class="action hidden" id="retry">Check again</button>
        </div>

        <!-- Previous versions (rollback) -->
        <div class="picker">
          <button class="picker-toggle" id="pickertoggle">
            <span>Previous versions</span>
            <span class="chev">›</span>
          </button>
          <div class="picker-list" id="pickerlist"></div>
          <p class="picker-note hidden" id="pickernote"></p>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const fill = $("fill");
        const status = $("status");
        const title = $("title");
        const left = $("left");
        const right = $("right");
        const installBtn = $("install");
        const cancelBtn = $("cancel");
        const retryBtn = $("retry");
        const pill = $("pill");
        const curver = $("curver");
        const pickerToggle = $("pickertoggle");
        const pickerList = $("pickerlist");
        const pickerNote = $("pickernote");

        function hideAllButtons() {
          installBtn.classList.add("hidden");
          cancelBtn.classList.add("hidden");
          retryBtn.classList.add("hidden");
        }

        function render(s) {
          if (s.status === "checking") {
            hideAllButtons();
            title.textContent = "Checking for updates";
            pill.textContent = "checking";
            status.textContent = "Clutchly looks for the latest build on GitHub…";
            left.textContent = "Please wait";
            right.textContent = "";
            fill.style.width = "0%";
          } else if (s.status === "available") {
            hideAllButtons();
            cancelBtn.classList.remove("hidden");
            title.textContent = "Update available";
            pill.textContent = "v" + (s.version || "new");
            status.textContent = "Downloading in the background — you'll see it right here.";
            left.textContent = "Starting download…";
            right.textContent = "";
          } else if (s.status === "downloading") {
            hideAllButtons();
            cancelBtn.classList.remove("hidden");
            const pct = s.percent || 0;
            fill.style.width = pct + "%";
            title.textContent = "Updating Clutchly";
            pill.textContent = pct + "%";
            status.textContent = "Downloading the update — keep playing, it installs when ready.";
            left.textContent = pct + "%";
            if (s.total) {
              const mb = (b) => (b / 1048576).toFixed(1) + " MB";
              right.textContent = mb(s.transferred || 0) + " / " + mb(s.total);
            } else {
              right.textContent = "";
            }
          } else if (s.status === "downloaded") {
            hideAllButtons();
            installBtn.classList.remove("hidden");
            title.textContent = "Ready to update";
            pill.textContent = "ready";
            status.textContent = "The new version is downloaded and ready to install.";
            left.textContent = "100%";
            right.textContent = "Tap Restart to finish";
            fill.style.width = "100%";
          } else if (s.status === "none") {
            hideAllButtons();
            title.textContent = "You're up to date";
            pill.textContent = "latest";
            status.textContent = "Clutchly is running the newest version.";
            left.textContent = "All good ✓";
            right.textContent = "";
          } else if (s.status === "error") {
            hideAllButtons();
            retryBtn.classList.remove("hidden");
            title.textContent = "Update check failed";
            pill.textContent = "offline";
            status.textContent = "Couldn't reach the update server.";
            left.textContent = s.message || "Something went wrong";
            right.textContent = "";
          }
        }

        function fmtDate(iso) {
          if (!iso) return "—";
          const d = new Date(iso);
          return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
        }

        function fmtSize(b) {
          return b ? (b / 1048576).toFixed(0) + " MB" : "";
        }

        async function loadVersions() {
          if (!window.updater) return;
          try {
            const res = await window.updater.getVersions();
            if (!res || !res.ok || !Array.isArray(res.versions)) {
              pickerNote.textContent = "Couldn't load previous versions.";
              pickerNote.classList.remove("hidden");
              return;
            }
            const rows = res.versions.map((v) => {
              const row = document.createElement("div");
              row.className = "ver-row";
              const info = document.createElement("div");
              const name = document.createElement("p");
              name.className = "v";
              name.textContent = "v" + v.version;
              const meta = document.createElement("p");
              meta.className = "m";
              meta.textContent = [fmtDate(v.publishedAt), fmtSize(v.size)].filter(Boolean).join(" · ");
              info.append(name, meta);
              const btn = document.createElement("button");
              btn.className = "rollback";
              btn.textContent = "Install";
              btn.addEventListener("click", async () => {
                if (!v.assetUrl) return;
                btn.disabled = true;
                btn.textContent = "Downloading…";
                const r = await window.updater.installVersion(v.assetUrl);
                btn.textContent = r && r.ok ? "Installing…" : "Failed";
                if (!r || !r.ok) {
                  setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = "Install";
                  }, 2500);
                }
              });
              row.append(info, btn);
              return row;
            });
            pickerList.replaceChildren(...rows);
            pickerNote.classList.add("hidden");
          } catch {
            pickerNote.textContent = "Couldn't load previous versions.";
            pickerNote.classList.remove("hidden");
          }
        }

        if (window.updater) {
          window.updater.onState(render);
          window.updater.getCurrentVersion().then((v) => {
            if (v) curver.textContent = "v" + v;
          });
          pickerToggle.addEventListener("click", () => {
            const open = pickerList.classList.toggle("open");
            pickerToggle.classList.toggle("open", open);
            // Grow the toast so the list fits; collapse it back when closed.
            window.updater.setSize(404, open ? 352 : 264);
            if (open && !pickerList.childElementCount) {
              pickerList.textContent = "";
              const loading = document.createElement("p");
              loading.className = "picker-loading";
              loading.textContent = "Loading versions…";
              pickerList.append(loading);
              loadVersions();
            }
          });
          $("close").addEventListener("click", () => window.updater.close());
          $("cancel").addEventListener("click", () => window.updater.close());
          $("install").addEventListener("click", () => window.updater.install());
        }
      })();
    </script>
  </body>
</html>
