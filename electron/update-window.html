<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Clutchly — Update</title>
    <style>
      :root {
        --bg: rgba(9, 11, 14, 0.92);
        --line: rgba(255, 255, 255, 0.1);
        --muted: #9aa3af;
        --accent: #4cc2ff;
        --accent-2: #2f9bd8;
      }
      @property --angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      body {
        background: transparent;
        height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 14px;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Shimmering rotating border ring around the toast. */
      .card {
        position: relative;
        width: 376px;
        border-radius: 8px;
        background: var(--bg);
        backdrop-filter: blur(14px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 10px;
        padding: 2px;
        background: conic-gradient(
          from var(--angle),
          transparent 0deg,
          rgba(76, 194, 255, 0) 60deg,
          rgba(76, 194, 255, 0.95) 130deg,
          rgba(47, 155, 216, 0.55) 180deg,
          transparent 250deg,
          rgba(255, 255, 255, 0.25) 330deg,
          transparent 360deg
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: spin 3.2s linear infinite;
        pointer-events: none;
        z-index: 1;
      }
      @keyframes spin {
        to {
          --angle: 360deg;
        }
      }

      .inner {
        position: relative;
        z-index: 2;
        padding: 16px 18px 14px;
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 10px rgba(76, 194, 255, 0.8);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      .brand b {
        font-size: 13px;
        letter-spacing: 0.02em;
        color: #fafafa;
      }
      .close {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: #82878f;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        transition: 0.15s ease;
      }
      .close:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
      }

      .title {
        font-size: 14px;
        font-weight: 600;
        color: #f4f4f5;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pill {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        background: rgba(76, 194, 255, 0.12);
        border: 1px solid rgba(76, 194, 255, 0.3);
        border-radius: 99px;
        padding: 2px 8px;
      }
      .status {
        margin: 4px 0 13px;
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
        line-height: 1.45;
      }

      .bar {
        height: 6px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        box-shadow: 0 0 12px rgba(76, 194, 255, 0.7);
        transition: width 0.25s ease;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 7px;
        font-size: 11px;
        color: #6f7780;
        font-variant-numeric: tabular-nums;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }
      button.action {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: #d7dbe0;
        font-size: 12px;
        font-weight: 500;
        padding: 8px 15px;
        cursor: pointer;
        transition: 0.15s ease;
      }
      button.action:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
      }
      button.primary {
        border-color: rgba(76, 194, 255, 0.45);
        background: linear-gradient(135deg, rgba(76, 194, 255, 0.9), rgba(47, 155, 216, 0.9));
        color: #06131d;
        font-weight: 600;
      }
      button.primary::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.5) 50%, transparent 68%);
        background-size: 220% 100%;
        animation: sweep 2.4s linear infinite;
        pointer-events: none;
      }
      @keyframes sweep {
        0% {
          background-position: 130% 0;
        }
        100% {
          background-position: -130% 0;
        }
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="inner">
        <div class="head">
          <div class="brand">
            <span class="dot"></span>
            <b>Clutchly</b>
          </div>
          <button class="close" id="close" aria-label="Close">✕</button>
        </div>

        <div class="title">
          <span id="title">Update</span>
          <span class="pill" id="pill">checking</span>
        </div>
        <div class="status" id="status">Checking for updates…</div>

        <div class="bar"><div class="fill" id="fill"></div></div>

        <div class="meta">
          <span id="left">Preparing…</span>
          <span id="right"></span>
        </div>

        <div class="actions">
          <button class="action hidden" id="cancel">Later</button>
          <button class="action primary hidden" id="install">Restart now</button>
          <button class="action hidden" id="retry">Check again</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const fill = $("fill");
        const status = $("status");
        const title = $("title");
        const left = $("left");
        const right = $("right");
        const installBtn = $("install");
        const cancelBtn = $("cancel");
        const retryBtn = $("retry");
        const pill = $("pill");

        function hideAllButtons() {
          installBtn.classList.add("hidden");
          cancelBtn.classList.add("hidden");
          retryBtn.classList.add("hidden");
        }

        function render(s) {
          if (s.status === "checking") {
            hideAllButtons();
            title.textContent = "Checking for updates";
            pill.textContent = "checking";
            status.textContent = "Clutchly looks for the latest build on GitHub…";
            left.textContent = "Please wait";
            right.textContent = "";
            fill.style.width = "0%";
          } else if (s.status === "available") {
            hideAllButtons();
            cancelBtn.classList.remove("hidden");
            title.textContent = "Update available";
            pill.textContent = "v" + (s.version || "new");
            status.textContent = "Downloading in the background — you'll see it right here.";
            left.textContent = "Starting download…";
            right.textContent = "";
          } else if (s.status === "downloading") {
            hideAllButtons();
            cancelBtn.classList.remove("hidden");
            const pct = s.percent || 0;
            fill.style.width = pct + "%";
            title.textContent = "Updating Clutchly";
            pill.textContent = pct + "%";
            status.textContent = "Downloading the update — keep playing, it installs when ready.";
            left.textContent = pct + "%";
            if (s.total) {
              const mb = (b) => (b / 1048576).toFixed(1) + " MB";
              right.textContent = mb(s.transferred || 0) + " / " + mb(s.total);
            } else {
              right.textContent = "";
            }
          } else if (s.status === "downloaded") {
            hideAllButtons();
            installBtn.classList.remove("hidden");
            title.textContent = "Ready to update";
            pill.textContent = "ready";
            status.textContent = "The new version is downloaded and ready to install.";
            left.textContent = "100%";
            right.textContent = "Tap Restart to finish";
            fill.style.width = "100%";
          } else if (s.status === "none") {
            hideAllButtons();
            title.textContent = "You're up to date";
            pill.textContent = "latest";
            status.textContent = "Clutchly is running the newest version.";
            left.textContent = "All good ✓";
            right.textContent = "";
          } else if (s.status === "error") {
            hideAllButtons();
            retryBtn.classList.remove("hidden");
            title.textContent = "Update check failed";
            pill.textContent = "offline";
            status.textContent = "Couldn't reach the update server.";
            left.textContent = s.message || "Something went wrong";
            right.textContent = "";
          }
        }

        if (window.updater) {
          window.updater.onState(render);
          $("close").addEventListener("click", () => window.updater.close());
          $("cancel").addEventListener("click", () => window.updater.close());
          $("install").addEventListener("click", () => window.updater.install());
        }
      })();
    </script>
  </body>
</html>
